<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AirBattle: Remake</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        margin: 0;
        padding: 0;
      }
      body, html {
        width: 100%;
        height: 100%;
        background-color: #050508;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #game-container {
        position: relative;
        box-shadow: 0 0 40px rgba(0, 180, 255, 0.25), 0 0 10px rgba(0,0,0,0.8);
        border-radius: 4px;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      #loading-screen {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, #111a28 0%, #04060a 100%);
        color: #7df9ff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.4s ease;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(0, 210, 255, 0.2);
        border-top-color: #00e5ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .tip-text {
        color: #8899aa;
        font-size: 13px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="loading-screen">
        <div class="spinner"></div>
        <h2 style="letter-spacing: 2px;">AIR BATTLE</h2>
        <p class="tip-text" id="loading-tip">正在初始化资源与引擎...</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
